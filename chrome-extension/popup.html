<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zearn Hint Overlay</title>
  <style>
    body { width: 320px; padding: 16px; color: #111827; font-family: system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 12px; color: #4b5563; line-height: 1.45; }
    textarea { width: 100%; min-height: 86px; box-sizing: border-box; resize: vertical; }
    button { margin-top: 10px; padding: 8px 12px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Zearn Hint Overlay</h1>
  <p>Configure five hints, then the extension will reveal them every 30 seconds and show the answer after two minutes.</p>
  <label for="hints">Hints, separated by new lines</label>
  <textarea id="hints">Start by identifying the key data or state involved.
Trace the flow from input to output.
Inspect the smallest useful part of the implementation.
Compare the behavior with a working example.
Consider the final condition and how it is reached.</textarea>
  <label for="answer">Answer</label>
  <textarea id="answer">The answer is configured in this popup.</textarea>
  <button id="save">Save settings</button>
  <script src="popup.js"></script>
</body>
</html>
